name = "pocket-tarot-ai"
main = "cloudflare-worker.js"
compatibility_date = "2026-09-06"

# Rota do Worker no domínio próprio. A rota oficial é
# **`api.jrpasolini.tech/*` → `pocket-tarot-ai`**, com `request_limit_fail_open: false`
# (fail closed), e ela é **gerenciada FORA deste arquivo** (API/painel).
# Por isso fica comentada: um `wrangler deploy` reconcilia `routes` e pode
# sobrescrever a configuração manual.
#   Conferir:  GET /zones/<zone_id>/workers/routes
#   Permissão: Zona → Workers Routes → Editar (zona `jrpasolini.tech`)
#   Rollback:  PUT /zones/<zone_id>/workers/routes/<route_id>
#              {"pattern":"*.jrpasolini.tech/*","script":"pocket-tarot-ai","request_limit_fail_open":false}
#              (reabre o curinga — estado anterior a 16/10; evitar)
# Histórico: em 16/10 a zona estava com `*.jrpasolini.tech/*` e a rota foi
# estreitada para `api.jrpasolini.tech/*` via PUT no próprio ID (e9ecc359…),
# preservando o vínculo e o fail closed. O DNS é um CNAME proxied que nós
# controlamos (`api` → `<worker>.workers.dev`), criado pela API.
# routes = [
#   { pattern = "api.jrpasolini.tech/*", zone_name = "jrpasolini.tech" }
# ]

# ✅ Aposentado em 2026-10-16: o app já usa `api.jrpasolini.tech` (rota) e o
# `workers.dev` sai do ar. Verifique também URLs de preview/versionamento.
# (Lembrete da casa: ao definir `routes`, o wrangler desliga o workers.dev por
# padrão — foi um `workers_dev = true` explícito que segurou o app de pé durante
# a migração. Agora que a migração terminou, `false` é o estado final.)
workers_dev = false

# Version/Preview URLs são entradas públicas alternativas e podem contornar o
# WAF da zona. O estado efetivo da Cloudflare deve ser conferido após o deploy.
preview_urls = false

# Binding da Workers AI. O Worker aceita tanto `env["tarot-ai"]` (nome usado
# no painel) quanto o fallback `env.AI`.
[ai]
binding = "tarot-ai"

# Variáveis em texto puro que JÁ existem em produção. Precisam estar aqui:
# um `wrangler deploy` substitui as vars do script pelas do arquivo, então
# omiti-las apagaria a allowlist de CORS e a voz da narração.
# Os segredos (ELEVENLABS_API_KEY, NARRATION_SIGNING_KEY) são gerenciados
# separadamente e sobrevivem ao deploy.
[vars]
ALLOWED_ORIGINS = "https://pocket-oracle-0saq.onrender.com"
ELEVENLABS_VOICE_ID = "RGymW84CSmfVugnA5tvA"

[observability]
enabled = true
